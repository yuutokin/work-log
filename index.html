        <div style={{ fontSize: 12, fontWeight: 600, color: "#64748b", marginBottom: 6 }}>メモ</div>
        <textarea value={memo} onChange={(e) => setMemo(e.target.value)} placeholder="補足事項、進め方など" rows={3}
          style={{ ...inp, resize: "vertical", lineHeight: 1.6 }}
          onFocus={(e) => e.target.style.borderColor = themeColor} onBlur={(e) => e.target.style.borderColor = "#e2e8f0"} />
      </div>

      <div style={{ display: "flex", gap: 10 }}>
        <button onClick={onCancel} style={{ flex: 1, padding: "12px 0", borderRadius: 12, border: "1.5px solid #e2e8f0", background: "#fff", color: "#64748b", fontSize: 14, fontWeight: 600, cursor: "pointer" }}>キャンセル</button>
        <button disabled={!canSave} onClick={() => {
          if (!canSave) return;
          onSave({
            id: initialData?.id || generateId(),
            type, title: title.trim(), deadline: deadline || "", memo: memo.trim(),
            chatUrl: chatUrl.trim(),
            isBilling: type === "mail" ? isBilling : false,
            printed: type === "mail" ? printed : false,
            destination: type === "mail" ? destination : "",
            done: initialData?.done || false,
            createdAt: initialData?.createdAt || new Date().toISOString(),
            doneAt: initialData?.doneAt || null,
          });
        }} style={{ flex: 2, padding: "12px 0", borderRadius: 12, border: "none", background: canSave ? themeColor : "#cbd5e1", color: "#fff", fontSize: 14, fontWeight: 700, cursor: canSave ? "pointer" : "default" }}>
          {initialData ? "更新する" : "追加する"}
        </button>
      </div>
    </div>
  );
}

// ─── TodayTodoPreview ───
function TodayTodoPreview({ todos, onToggle, onGoToTodos }) {
  const today = getToday();
  const active = todos
    .filter(t => !t.done && (!t.deadline || t.deadline <= today))
    .sort((a, b) => { if (!a.deadline && !b.deadline) return 0; if (!a.deadline) return 1; if (!b.deadline) return -1; return a.deadline.localeCompare(b.deadline); });
  if (active.length === 0) return null;
  return (
    <div style={{ background: "#fff", borderRadius: 14, padding: "12px 14px", marginBottom: 14, boxShadow: "0 1px 4px rgba(0,0,0,0.04)" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
        <div style={{ fontSize: 12, fontWeight: 700, color: "#64748b" }}>📌 今日やること ({active.length}件)</div>
        <button onClick={onGoToTodos} style={{ background: "none", border: "none", fontSize: 11, color: "#7c3aed", fontWeight: 600, cursor: "pointer" }}>すべて見る →</button>
      </div>
      {active.slice(0, 5).map(todo => (
        <TodoItem key={todo.id} todo={todo} onToggle={onToggle} onDelete={() => {}} onEdit={() => {}} compact />
      ))}
      {active.length > 5 && (
        <div style={{ fontSize: 11, color: "#94a3b8", textAlign: "center", marginTop: 4 }}>他{active.length - 5}件…</div>
      )}
    </div>
  );
}

// ─── DestsManager ───
function DestsManager({ dests, onSave, onClose }) {
  const [list, setList] = useState([...dests]);
  const [input, setInput] = useState("");

  const add = () => {
    const v = input.trim();
    if (v && !list.includes(v)) {
      setList([...list, v]);
      setInput("");
    }
  };
  const remove = (i) => setList(list.filter((_, idx) => idx !== i));
  const move = (i, dir) => {
    const ni = i + dir;
    if (ni < 0 || ni >= list.length) return;
    const newList = [...list];
    [newList[i], newList[ni]] = [newList[ni], newList[i]];
    setList(newList);
  };

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", zIndex: 250, display: "flex", alignItems: "flex-end", justifyContent: "center" }} onClick={onClose}>
      <div style={{ background: "#fff", borderRadius: "20px 20px 0 0", width: "100%", maxWidth: 520, maxHeight: "80vh", overflowY: "auto", padding: "24px 20px 40px" }} onClick={e => e.stopPropagation()}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <div>
            <div style={{ fontSize: 16, fontWeight: 800, color: "#1e293b" }}>📍 郵送先の管理</div>
            <div style={{ fontSize: 12, color: "#64748b", marginTop: 2 }}>郵送先の選択肢を追加・編集できます</div>
          </div>
          <button onClick={onClose} style={{ background: "#f1f5f9", border: "none", borderRadius: 8, width: 32, height: 32, fontSize: 16, cursor: "pointer", color: "#64748b" }}>×</button>
        </div>

        {/* Add */}
        <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
          <input value={input} onChange={e => setInput(e.target.value)}
            onKeyDown={e => e.key === "Enter" && add()}
            placeholder="例：東京地裁、〇〇法律事務所、ITJ など"
            style={{ flex: 1, padding: "10px 14px", borderRadius: 10, border: "1.5px solid #e2e8f0", fontSize: 14, outline: "none", boxSizing: "border-box", fontFamily: "inherit" }}
            onFocus={e => e.target.style.borderColor = "#0891b2"} onBlur={e => e.target.style.borderColor = "#e2e8f0"} />
          <button onClick={add} disabled={!input.trim()} style={{
            padding: "10px 18px", borderRadius: 10, border: "none",
            background: input.trim() ? "#0891b2" : "#cbd5e1",
            color: "#fff", fontSize: 13, fontWeight: 700, cursor: input.trim() ? "pointer" : "default",
          }}>＋ 追加</button>
        </div>

        {/* List */}
        {list.length === 0 && (
          <div style={{ textAlign: "center", padding: 30, color: "#94a3b8", fontSize: 13 }}>
            まだ郵送先が登録されていません
          </div>
        )}
        {list.map((d, i) => (
          <div key={i} style={{
            display: "flex", alignItems: "center", gap: 8, padding: "10px 12px",
            background: "#f8fafc", borderRadius: 10, marginBottom: 6,
          }}>
            <span style={{ fontSize: 13, color: "#1e293b", fontWeight: 500, flex: 1 }}>{d}</span>
            <button onClick={() => move(i, -1)} disabled={i === 0} style={{
              background: "none", border: "none", fontSize: 14, cursor: i === 0 ? "default" : "pointer",
              color: i === 0 ? "#cbd5e1" : "#64748b", padding: 4,
            }}>↑</button>
            <button onClick={() => move(i, 1)} disabled={i === list.length - 1} style={{
              background: "none", border: "none", fontSize: 14, cursor: i === list.length - 1 ? "default" : "pointer",
              color: i === list.length - 1 ? "#cbd5e1" : "#64748b", padding: 4,
            }}>↓</button>
            <button onClick={() => remove(i)} style={{
              background: "none", border: "none", fontSize: 14, cursor: "pointer", color: "#dc2626", padding: 4,
            }}>×</button>
          </div>
        ))}

        {/* Save */}
        <div style={{ display: "flex", gap: 10, marginTop: 16 }}>
          <button onClick={onClose} style={{ flex: 1, padding: "12px 0", borderRadius: 12, border: "1.5px solid #e2e8f0", background: "#fff", color: "#64748b", fontSize: 14, fontWeight: 600, cursor: "pointer" }}>キャンセル</button>
          <button onClick={() => { onSave(list); onClose(); }} style={{
            flex: 2, padding: "12px 0", borderRadius: 12, border: "none",
            background: "#0891b2", color: "#fff", fontSize: 14, fontWeight: 700, cursor: "pointer",
          }}>保存する</button>
        </div>
      </div>
    </div>
  );
}

// ─── TodoView ───
function TodoView({ todos, dests, onSave, onDelete, onToggle, onTogglePrint, onSaveDests }) {
  const [showForm, setShowForm] = useState(false);
  const [editingTodo, setEditingTodo] = useState(null);
  const [formDefaultType, setFormDefaultType] = useState("normal");
  const [typeTab, setTypeTab] = useState("normal");
  const [filter, setFilter] = useState("active");
  const [sortBy, setSortBy] = useState("deadline"); // deadline | destination
  const [showDestsMgr, setShowDestsMgr] = useState(false);
  const today = getToday();

  const typed = todos.filter(t => (t.type || "normal") === typeTab);
  const filtered = typed.filter(t => filter === "active" ? !t.done : filter === "done" ? t.done : true)
    .sort((a, b) => {
      if (a.done !== b.done) return a.done ? 1 : -1;
      if (typeTab === "mail" && sortBy === "destination") {
        const ad = a.destination || "zzz_未設定";
        const bd = b.destination || "zzz_未設定";
        if (ad !== bd) return ad.localeCompare(bd);
      }
      if (!a.deadline && !b.deadline) return 0;
      if (!a.deadline) return 1;
      if (!b.deadline) return -1;
      return a.deadline.localeCompare(b.deadline);
    });

  const overdueCount = typed.filter(t => !t.done && t.deadline && t.deadline < today).length;
  const todayCount = typed.filter(t => !t.done && t.deadline === today).length;
  const activeCount = typed.filter(t => !t.done).length;
  const unprintedCount = typeTab === "mail" ? typed.filter(t => !t.done && !t.printed).length : 0;

  const handleSave = (todo) => { onSave(todo); setShowForm(false); setEditingTodo(null); };
  const handleEdit = (todo) => { setEditingTodo(todo); setShowForm(true); };
  const themeColor = typeTab === "mail" ? "#0891b2" : "#7c3aed";
  const themeBg = typeTab === "mail" ? "linear-gradient(135deg, #155e75, #0891b2)" : "linear-gradient(135deg, #581c87, #7c3aed)";

  // 郵送先でグループ化する場合のための補助
  const showDestGroups = typeTab === "mail" && sortBy === "destination";
  let lastDest = null;

  return (
    <div style={{ padding: "0 0 100px", maxWidth: 520, margin: "0 auto" }}>
      <div style={{ background: themeBg, padding: "24px 18px 20px", borderRadius: "0 0 24px 24px", color: "#fff", marginBottom: 18 }}>
        <div style={{ fontSize: 11, opacity: 0.7, fontWeight: 500, letterSpacing: 1 }}>TO-DO LIST</div>
        <div style={{ fontSize: 20, fontWeight: 800, marginTop: 2, marginBottom: 14 }}>
          {typeTab === "mail" ? "📮 郵送タスク" : "タスク管理"}
        </div>
        <div style={{ display: "flex", gap: 16, justifyContent: "center" }}>
          <div style={{ textAlign: "center" }}><div style={{ fontSize: 22, fontWeight: 800 }}>{activeCount}</div><div style={{ fontSize: 10, opacity: 0.7 }}>未完了</div></div>
          <div style={{ width: 1, background: "rgba(255,255,255,0.2)" }} />
          <div style={{ textAlign: "center" }}><div style={{ fontSize: 22, fontWeight: 800, color: todayCount > 0 ? "#fde68a" : "#fff" }}>{todayCount}</div><div style={{ fontSize: 10, opacity: 0.7 }}>今日まで</div></div>
          <div style={{ width: 1, background: "rgba(255,255,255,0.2)" }} />
          <div style={{ textAlign: "center" }}><div style={{ fontSize: 22, fontWeight: 800, color: overdueCount > 0 ? "#fecaca" : "#fff" }}>{overdueCount}</div><div style={{ fontSize: 10, opacity: 0.7 }}>期限超過</div></div>
          {typeTab === "mail" && (
            <>
              <div style={{ width: 1, background: "rgba(255,255,255,0.2)" }} />
              <div style={{ textAlign: "center" }}><div style={{ fontSize: 22, fontWeight: 800, color: unprintedCount > 0 ? "#fecaca" : "#fff" }}>{unprintedCount}</div><div style={{ fontSize: 10, opacity: 0.7 }}>未印刷</div></div>
            </>
          )}
        </div>
      </div>

      <div style={{ padding: "0 16px" }}>
        {/* 種類タブ */}
        <div style={{ display: "flex", gap: 6, marginBottom: 14 }}>
          <button onClick={() => { setTypeTab("normal"); setShowForm(false); setEditingTodo(null); }} style={{
            flex: 1, padding: "10px 0", borderRadius: 10,
            border: typeTab === "normal" ? "2px solid #7c3aed" : "2px solid #e2e8f0",
            background: typeTab === "normal" ? "#faf5ff" : "#fff",
            color: typeTab === "normal" ? "#7c3aed" : "#64748b",
            fontSize: 13, fontWeight: 700, cursor: "pointer",
          }}>通常タスク</button>
          <button onClick={() => { setTypeTab("mail"); setShowForm(false); setEditingTodo(null); }} style={{
            flex: 1, padding: "10px 0", borderRadius: 10,
            border: typeTab === "mail" ? "2px solid #0891b2" : "2px solid #e2e8f0",
            background: typeTab === "mail" ? "#ecfeff" : "#fff",
            color: typeTab === "mail" ? "#0891b2" : "#64748b",
            fontSize: 13, fontWeight: 700, cursor: "pointer",
          }}>📮 郵送タスク</button>
        </div>

        {showForm ? (
          <TodoForm onSave={handleSave} onCancel={() => { setShowForm(false); setEditingTodo(null); }} initialData={editingTodo} defaultType={formDefaultType} dests={dests} onManageDests={() => setShowDestsMgr(true)} />
        ) : (
          <button onClick={() => { setEditingTodo(null); setFormDefaultType(typeTab); setShowForm(true); }} style={{
            width: "100%", padding: "14px", borderRadius: 14,
            border: typeTab === "mail" ? "2px dashed #67e8f9" : "2px dashed #d8b4fe",
            background: "#fff", color: themeColor, fontSize: 14, fontWeight: 700, cursor: "pointer", marginBottom: 16,
          }}>＋ {typeTab === "mail" ? "郵送" : ""}ToDoを追加</button>
        )}

        {/* フィルタ＋並び替え（郵送タブのみ） */}
        <div style={{ display: "flex", gap: 6, marginBottom: 14 }}>
          {[{id:"active",label:"未完了"},{id:"done",label:"完了"},{id:"all",label:"すべて"}].map(f => (
            <button key={f.id} onClick={() => setFilter(f.id)} style={{
              flex: 1, padding: "8px 0", borderRadius: 10,
              border: filter === f.id ? `2px solid ${themeColor}` : "2px solid #e2e8f0",
              background: filter === f.id ? (typeTab === "mail" ? "#ecfeff" : "#faf5ff") : "#fff",
              color: filter === f.id ? themeColor : "#64748b", fontSize: 12, fontWeight: 700, cursor: "pointer",
            }}>{f.label}</button>
          ))}
        </div>

        {typeTab === "mail" && (
          <div style={{ display: "flex", gap: 6, marginBottom: 14, alignItems: "center" }}>
            <span style={{ fontSize: 11, color: "#64748b", fontWeight: 600 }}>並び順：</span>
            <button onClick={() => setSortBy("deadline")} style={{
              padding: "5px 12px", borderRadius: 16,
              border: sortBy === "deadline" ? "1.5px solid #0891b2" : "1.5px solid #e2e8f0",
              background: sortBy === "deadline" ? "#ecfeff" : "#fff",
              color: sortBy === "deadline" ? "#0891b2" : "#94a3b8",
              fontSize: 11, fontWeight: 700, cursor: "pointer",
            }}>📅 期限順</button>
            <button onClick={() => setSortBy("destination")} style={{
              padding: "5px 12px", borderRadius: 16,
              border: sortBy === "destination" ? "1.5px solid #0891b2" : "1.5px solid #e2e8f0",
              background: sortBy === "destination" ? "#ecfeff" : "#fff",
              color: sortBy === "destination" ? "#0891b2" : "#94a3b8",
              fontSize: 11, fontWeight: 700, cursor: "pointer",
            }}>📍 郵送先順</button>
            <button onClick={() => setShowDestsMgr(true)} style={{
              marginLeft: "auto",
              padding: "5px 12px", borderRadius: 16, border: "1.5px solid #0891b2",
              background: "#fff", color: "#0891b2", fontSize: 11, fontWeight: 700, cursor: "pointer",
            }}>📍 郵送先管理</button>
          </div>
        )}

        {filtered.length === 0 && (
          <div style={{ textAlign: "center", padding: "40px 20px", color: "#94a3b8" }}>
            <div style={{ fontSize: 36, marginBottom: 10 }}>{typeTab === "mail" ? "📭" : "✨"}</div>
            <div style={{ fontSize: 14, fontWeight: 500 }}>{filter === "active" ? "未完了のタスクはありません" : filter === "done" ? "完了したタスクはありません" : "タスクがありません"}</div>
          </div>
        )}

        {filtered.map(todo => {
          // 郵送先グループヘッダーを表示
          let groupHeader = null;
          if (showDestGroups) {
            const curDest = todo.destination || "（未設定）";
            if (curDest !== lastDest) {
              lastDest = curDest;
              groupHeader = (
                <div style={{
                  fontSize: 12, fontWeight: 700, color: "#0891b2",
                  marginTop: 12, marginBottom: 6, paddingBottom: 4,
                  borderBottom: "1px solid #cffafe",
                }}>📍 {curDest}</div>
              );
            }
          }
          return (
            <React.Fragment key={todo.id}>
              {groupHeader}
              <TodoItem todo={todo} onToggle={onToggle} onDelete={onDelete} onEdit={handleEdit} onTogglePrint={onTogglePrint} />
            </React.Fragment>
          );
        })}
      </div>

      {showDestsMgr && (
        <DestsManager dests={dests} onSave={onSaveDests} onClose={() => setShowDestsMgr(false)} />
      )}
    </div>
  );
}

// ─── MorningReportModal ───
function MorningReportModal({ date, onClose }) {
  const [events, setEvents] = useState(null);
  const [loading, setLoading] = useState(true);
  const [goal, setGoal] = useState("");
  const [sending, setSending] = useState(false);
  const [sent, setSent] = useState(false);
  const [copied, setCopied] = useState(false);

  useEffect(() => {
    setLoading(true);
    cloudFetchCalendar(date).then(ev => {
      setEvents(ev || []);
      setLoading(false);
    });
  }, [date]);

  function buildText() {
    let text = `━━━━━━━━━━━━━━━━━━━━━━\n🌅 業務前日報　${formatDate(date)}\n━━━━━━━━━━━━━━━━━━━━━━\n\n`;
    text += `【本日の予定】\n`;
    if (!events || events.length === 0) {
      text += `  予定なし\n`;
    } else {
      events.forEach(ev => {
        if (ev.allDay) text += `  ・[終日] ${ev.title}`;
        else text += `  ・${ev.start}〜${ev.end} ${ev.title}`;
        if (ev.location) text += `（${ev.location}）`;
        text += "\n";
      });
    }
    if (goal.trim()) text += `\n【本日の目標】\n${goal.trim()}\n`;
    text += `━━━━━━━━━━━━━━━━━━━━━━`;
    return text;
  }

  const handleCopy = () => {
    navigator.clipboard.writeText(buildText()).then(() => { setCopied(true); setTimeout(() => setCopied(false), 2000); });
  };
  const handleSend = async () => {
    setSending(true);
    await sendToGoogleChat(buildText());
    setSending(false); setSent(true); setTimeout(() => setSent(false), 2000);
  };

  const inp = { width: "100%", padding: "10px 14px", borderRadius: 10, border: "1.5px solid #e2e8f0", fontSize: 14, outline: "none", boxSizing: "border-box", fontFamily: "inherit" };

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", zIndex: 200, display: "flex", alignItems: "flex-end", justifyContent: "center" }} onClick={onClose}>
      <div style={{ background: "#fff", borderRadius: "20px 20px 0 0", width: "100%", maxWidth: 520, maxHeight: "92vh", overflowY: "auto", padding: "24px 20px 44px" }} onClick={e => e.stopPropagation()}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <div>
            <div style={{ fontSize: 16, fontWeight: 800, color: "#1e293b" }}>🌅 業務前日報</div>
            <div style={{ fontSize: 12, color: "#64748b", marginTop: 2 }}>{formatDate(date)}</div>
          </div>
          <button onClick={onClose} style={{ background: "#f1f5f9", border: "none", borderRadius: 8, width: 32, height: 32, fontSize: 16, cursor: "pointer", color: "#64748b" }}>×</button>
        </div>

        {/* 予定一覧 */}
        <div style={{ marginBottom: 16 }}>
          <div style={{ fontSize: 12, fontWeight: 700, color: "#64748b", marginBottom: 8 }}>📅 本日の予定（Googleカレンダー）</div>
          <div style={{ background: "#f8fafc", borderRadius: 12, padding: 12, minHeight: 60 }}>
            {loading && <div style={{ fontSize: 12, color: "#94a3b8", textAlign: "center", padding: 20 }}>カレンダーを読み込み中…</div>}
            {!loading && (!events || events.length === 0) && (
              <div style={{ fontSize: 12, color: "#94a3b8", textAlign: "center", padding: 16 }}>本日の予定はありません</div>
            )}
            {!loading && events && events.length > 0 && events.map((ev, i) => (
              <div key={i} style={{ background: "#fff", borderRadius: 8, padding: "8px 10px", marginBottom: 6, borderLeft: "3px solid #f59e0b" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 2 }}>
                  <span style={{ fontSize: 11, color: "#d97706", fontWeight: 700, fontFamily: "monospace" }}>
                    {ev.allDay ? "終日" : `${ev.start}〜${ev.end}`}
                  </span>
                </div>
                <div style={{ fontSize: 13, fontWeight: 600, color: "#1e293b" }}>{ev.title}</div>
                {ev.location && <div style={{ fontSize: 11, color: "#64748b", marginTop: 2 }}>📍 {ev.location}</div>}
              </div>
            ))}
          </div>
        </div>

        {/* 本日の目標 */}
        <div style={{ marginBottom: 18 }}>
          <div style={{ fontSize: 12, fontWeight: 600, color: "#64748b", marginBottom: 6 }}>🎯 本日の目標</div>
          <textarea value={goal} onChange={e => setGoal(e.target.value)}
            placeholder="今日達成したいこと、注力したいタスクなど" rows={3}
            style={{ ...inp, resize: "vertical", lineHeight: 1.6 }}
            onFocus={e => e.target.style.borderColor = "#f59e0b"} onBlur={e => e.target.style.borderColor = "#e2e8f0"} />
        </div>

        {/* プレビュー */}
        <div style={{ background: "#fffbeb", borderRadius: 12, padding: 14, marginBottom: 16, fontSize: 11.5, lineHeight: 1.8, color: "#334155", fontFamily: "monospace", whiteSpace: "pre-wrap", maxHeight: 180, overflowY: "auto", border: "1px solid #fef3c7" }}>
          {buildText()}
        </div>

        {/* Actions */}
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={handleCopy} style={{
            flex: 1, padding: "12px 0", borderRadius: 12,
            border: copied ? "1.5px solid #059669" : "1.5px solid #64748b",
            background: copied ? "#ecfdf5" : "#f8fafc",
            color: copied ? "#059669" : "#475569", fontSize: 13, fontWeight: 700, cursor: "pointer",
          }}>{copied ? "✓ コピー済み" : "📋 コピー"}</button>
          <button onClick={handleSend} disabled={sending || loading} style={{
            flex: 2, padding: "12px 0", borderRadius: 12, border: "none",
            background: sent ? "#059669" : (sending || loading) ? "#94a3b8" : "#f59e0b",
            color: "#fff", fontSize: 13, fontWeight: 700, cursor: (sending || loading) ? "default" : "pointer",
          }}>{sent ? "✓ 完了" : sending ? "送信中…" : "🌅 Google Chatに送信"}</button>
        </div>
      </div>
    </div>
  );
}

function WorkLog() {
  const [entries, setEntries] = useState({});
  const [achievements, setAchievements] = useState([]);
  const [summaries, setSummaries] = useState([]);
  const [todos, setTodos] = useState([]);
  const [dests, setDests] = useState([]);
  const [selectedDate, setSelectedDate] = useState(getToday());
  const [showForm, setShowForm] = useState(false);
  const [showSummary, setShowSummary] = useState(false);
  const [showMorning, setShowMorning] = useState(false);
  const [editingTask, setEditingTask] = useState(null);
  const [view, setView] = useState("daily");
  const [syncStatus, setSyncStatus] = useState("syncing");
  const [loaded, setLoaded] = useState(false);
  const categoryMap = {}; CATEGORIES.forEach((c) => (categoryMap[c.id] = c));

  useEffect(() => {
    setSyncStatus("syncing");
    Promise.all([cloudFetch(), cloudFetchAch(), cloudFetchSummaries(), cloudFetchTodos(), cloudFetchDests()]).then(([cloud, cloudAch, cloudSum, cloudTodos, cloudDests]) => {
      if (cloud) { setEntries(cloud); saveLocal(cloud); } else { setEntries(loadLocal()); }
      if (cloudAch) { setAchievements(cloudAch); saveLocalAch(cloudAch); } else { setAchievements(loadLocalAch()); }
      if (cloudSum) { setSummaries(cloudSum); saveLocalSummaries(cloudSum); } else { setSummaries(loadLocalSummaries()); }
      if (cloudTodos) { setTodos(cloudTodos); saveLocalTodos(cloudTodos); } else { setTodos(loadLocalTodos()); }
      if (cloudDests) { setDests(cloudDests); saveLocalDests(cloudDests); } else { setDests(loadLocalDests()); }
      setSyncStatus(cloud ? "synced" : "offline");
      setLoaded(true);
    });
  }, []);

  useEffect(() => {
    function onVisible() {
      if (document.visibilityState === "visible") {
        setSyncStatus("syncing");
        Promise.all([cloudFetch(), cloudFetchAch(), cloudFetchSummaries(), cloudFetchTodos(), cloudFetchDests()]).then(([cloud, cloudAch, cloudSum, cloudTodos, cloudDests]) => {
          if (cloud) { setEntries(cloud); saveLocal(cloud); }
          if (cloudAch) { setAchievements(cloudAch); saveLocalAch(cloudAch); }
          if (cloudSum) { setSummaries(cloudSum); saveLocalSummaries(cloudSum); }
          if (cloudTodos) { setTodos(cloudTodos); saveLocalTodos(cloudTodos); }
          if (cloudDests) { setDests(cloudDests); saveLocalDests(cloudDests); }
          setSyncStatus(cloud ? "synced" : "offline");
        });
      }
    }
    document.addEventListener("visibilitychange", onVisible);
    return () => document.removeEventListener("visibilitychange", onVisible);
  }, []);

  const persist = useCallback((newEntries, changedDate) => {
    setEntries(newEntries); saveLocal(newEntries); setSyncStatus("syncing");
    const tasks = newEntries[changedDate] || [];
    const fn = tasks.length > 0 ? cloudSaveDay(changedDate, tasks) : cloudDeleteDay(changedDate);
    fn.then(() => setSyncStatus("synced")).catch(() => setSyncStatus("error"));
  }, []);

  const persistSummary = useCallback((summary) => {
    const newSummaries = [...summaries.filter(s => s.date !== summary.date), summary];
    setSummaries(newSummaries); saveLocalSummaries(newSummaries);
    cloudSaveSummaries(newSummaries).then(() => setSyncStatus("synced")).catch(() => setSyncStatus("error"));
  }, [summaries]);

  const persistAch = useCallback((newAch) => {
    setAchievements(newAch); saveLocalAch(newAch); setSyncStatus("syncing");
    cloudSaveAch(newAch).then(() => setSyncStatus("synced")).catch(() => setSyncStatus("error"));
  }, []);

  const persistTodos = useCallback((newTodos) => {
    setTodos(newTodos); saveLocalTodos(newTodos); setSyncStatus("syncing");
    cloudSaveTodos(newTodos).then(() => setSyncStatus("synced")).catch(() => setSyncStatus("error"));
  }, []);

  const handleSaveTodo = (todo) => {
    const idx = todos.findIndex(t => t.id === todo.id);
    persistTodos(idx >= 0 ? todos.map(t => t.id === todo.id ? todo : t) : [...todos, todo]);
  };
  const handleDeleteTodo = (id) => persistTodos(todos.filter(t => t.id !== id));
  const handleToggleTodo = (id) => persistTodos(todos.map(t => t.id === id ? { ...t, done: !t.done, doneAt: !t.done ? new Date().toISOString() : null } : t));
  const handleTogglePrint = (id) => persistTodos(todos.map(t => t.id === id ? { ...t, printed: !t.printed } : t));

  const persistDests = useCallback((newDests) => {
    setDests(newDests); saveLocalDests(newDests); setSyncStatus("syncing");
    cloudSaveDests(newDests).then(() => setSyncStatus("synced")).catch(() => setSyncStatus("error"));
  }, []);

  const todayTasks = entries[selectedDate] || [];

  const handleSave = (task) => {
    const ne = { ...entries }; const dt = [...(ne[selectedDate] || [])];
    const idx = dt.findIndex((t) => t.id === task.id);
    if (idx >= 0) dt[idx] = task; else dt.push(task);
    ne[selectedDate] = dt;
    setEntries(ne); saveLocal(ne); setSyncStatus("syncing");
    cloudSaveTask(selectedDate, task).then(() => setSyncStatus("synced")).catch(() => setSyncStatus("error"));
    setShowForm(false); setEditingTask(null);
  };
  const handleDelete = (taskId) => {
    const ne = { ...entries };
    ne[selectedDate] = (ne[selectedDate] || []).filter((t) => t.id !== taskId);
    if (ne[selectedDate].length === 0) delete ne[selectedDate];
    setEntries(ne); saveLocal(ne); setSyncStatus("syncing");
    cloudDeleteTask(taskId).then(() => setSyncStatus("synced")).catch(() => setSyncStatus("error"));
  };
  const handleEdit = (task) => { setEditingTask(task); setShowForm(true); };
  const changeDate = (delta) => {
    const d = new Date(selectedDate + "T00:00:00"); d.setDate(d.getDate() + delta);
    setSelectedDate(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`);
    setShowForm(false); setEditingTask(null);
  };
  const handleSaveAch = (item) => {
    const idx = achievements.findIndex(a => a.id === item.id);
    persistAch(idx >= 0 ? achievements.map(a => a.id === item.id ? item : a) : [...achievements, item]);
  };
  const handleDeleteAch = (id) => persistAch(achievements.filter(a => a.id !== id));

  const totalMins = todayTasks.reduce((s, t) => s + (t.minutes || (t.hours ? Math.round(t.hours * 60) : 0)), 0);

  const NavBar = () => (
    <div style={{
      position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)",
      width: "100%", maxWidth: 520, background: "#fff", borderTop: "1px solid #e2e8f0",
      display: "flex", zIndex: 100, paddingBottom: "env(safe-area-inset-bottom)",
    }}>
      {[
        { id: "daily", icon: "📋", label: "日報" },
        { id: "todos", icon: "✅", label: "ToDo" },
        { id: "achievements", icon: "🏆", label: "成果物" },
        { id: "monthly", icon: "📊", label: "月次" },
      ].map(tab => (
        <button key={tab.id} onClick={() => { setView(tab.id); }} style={{
          flex: 1, padding: "10px 0 8px", border: "none", background: "none", cursor: "pointer",
          color: view === tab.id ? "#2563eb" : "#94a3b8",
        }}>
          <div style={{ fontSize: 20 }}>{tab.icon}</div>
          <div style={{ fontSize: 10, fontWeight: view === tab.id ? 700 : 500, marginTop: 2 }}>{tab.label}</div>
        </button>
      ))}
    </div>
  );

  if (!loaded) {
    return (
      <div style={{ minHeight: "100vh", background: "#f5f7fb", display: "flex", alignItems: "center", justifyContent: "center" }}>
        <div style={{ textAlign: "center" }}>
          <div className="spinner" style={{ width: 28, height: 28, borderColor: "rgba(37,99,235,0.2)", borderTopColor: "#2563eb", borderWidth: 3, margin: "0 auto 12px" }} />
          <div style={{ fontSize: 14, color: "#64748b", fontWeight: 500 }}>データを同期中…</div>
        </div>
      </div>
    );
  }

  if (view === "monthly") return (
    <div style={{ minHeight: "100vh", background: "#f5f7fb", maxWidth: 520, margin: "0 auto" }}>
      <div style={{ padding: "16px 16px 100px" }}><MonthlyView entries={entries} achievements={achievements} onBack={() => setView("daily")} /></div>
      <NavBar />
    </div>
  );

  if (view === "todos") return (
    <div style={{ minHeight: "100vh", background: "#f5f7fb", maxWidth: 520, margin: "0 auto" }}>
      <TodoView todos={todos} dests={dests} onSave={handleSaveTodo} onDelete={handleDeleteTodo} onToggle={handleToggleTodo} onTogglePrint={handleTogglePrint} onSaveDests={persistDests} />
      <NavBar />
    </div>
  );

  if (view === "achievements") return (
    <div style={{ minHeight: "100vh", background: "#f5f7fb", maxWidth: 520, margin: "0 auto" }}>
      <AchievementsView achievements={achievements} onSave={handleSaveAch} onDelete={handleDeleteAch} />
      <NavBar />
    </div>
  );

  return (
    <div style={{ minHeight: "100vh", background: "#f5f7fb", padding: "0 0 100px", maxWidth: 520, margin: "0 auto" }}>
      <div style={{ background: "linear-gradient(135deg, #1e3a5f, #2563eb)", padding: "24px 18px 20px", borderRadius: "0 0 24px 24px", color: "#fff", marginBottom: 18 }}>
        <div style={{ marginBottom: 14 }}>
          <div style={{ fontSize: 11, opacity: 0.7, fontWeight: 500, letterSpacing: 1 }}>DAILY WORK LOG</div>
          <div style={{ fontSize: 20, fontWeight: 800, marginTop: 2 }}>業務日報</div>
          <div style={{ marginTop: 4 }}><SyncBadge status={syncStatus} /></div>
        </div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: "rgba(255,255,255,0.12)", borderRadius: 14, padding: "10px 14px" }}>
          <button onClick={() => changeDate(-1)} style={{ background: "none", border: "none", color: "#fff", fontSize: 20, cursor: "pointer", padding: "0 8px" }}>‹</button>
          <div style={{ textAlign: "center" }}>
            <div style={{ fontSize: 16, fontWeight: 700 }}>{formatDate(selectedDate)}</div>
            {selectedDate === getToday() && <div style={{ fontSize: 10, opacity: 0.8, marginTop: 2 }}>今日</div>}
          </div>
          <button onClick={() => changeDate(1)} style={{ background: "none", border: "none", color: "#fff", fontSize: 20, cursor: "pointer", padding: "0 8px" }}>›</button>
        </div>
        <div style={{ display: "flex", gap: 16, marginTop: 14, justifyContent: "center" }}>
          <div style={{ textAlign: "center" }}><div style={{ fontSize: 22, fontWeight: 800 }}>{todayTasks.length}</div><div style={{ fontSize: 10, opacity: 0.7 }}>記録</div></div>
          <div style={{ width: 1, background: "rgba(255,255,255,0.2)" }} />
          <div style={{ textAlign: "center" }}><div style={{ fontSize: 22, fontWeight: 800 }}>{formatMinutes(totalMins) || "0m"}</div><div style={{ fontSize: 10, opacity: 0.7 }}>時間</div></div>
          <div style={{ width: 1, background: "rgba(255,255,255,0.2)" }} />
          <div style={{ textAlign: "center" }}><div style={{ fontSize: 22, fontWeight: 800 }}>{new Set(todayTasks.map((t) => t.category)).size}</div><div style={{ fontSize: 10, opacity: 0.7 }}>カテゴリ</div></div>
        </div>
      </div>

      <div style={{ padding: "0 16px" }}>
        {!showForm && <TodayTodoPreview todos={todos} onToggle={handleToggleTodo} onGoToTodos={() => setView("todos")} />}

        {/* 業務前日報ボタン */}
        {!showForm && selectedDate === getToday() && (
          <button onClick={() => setShowMorning(true)} style={{
            width: "100%", padding: "12px", borderRadius: 14,
            border: "1.5px solid #fbbf24",
            background: "linear-gradient(135deg, #fef3c7, #fed7aa)",
            color: "#92400e", fontSize: 13, fontWeight: 700, cursor: "pointer", marginBottom: 12,
          }}>🌅 業務前日報を作成</button>
        )}

        {showForm ? (
          <TaskForm
            onSave={(task) => { handleSave(task); }}
            onCancel={() => { setShowForm(false); setEditingTask(null); }}
            initialData={editingTask}
          />
        ) : (
          <button onClick={() => { setEditingTask(null); setShowForm(true); }} style={{
            width: "100%", padding: "14px", borderRadius: 14, border: "2px dashed #cbd5e1",
            background: "#fff", color: "#2563eb", fontSize: 14, fontWeight: 700, cursor: "pointer", marginBottom: 16,
          }}>＋ 業務記録を追加</button>
        )}
        {todayTasks.length === 0 && !showForm && (
          <div style={{ textAlign: "center", padding: "40px 20px", color: "#94a3b8" }}>
            <div style={{ fontSize: 36, marginBottom: 10 }}>📋</div>
            <div style={{ fontSize: 14, fontWeight: 500 }}>この日の記録はまだありません</div>
            <div style={{ fontSize: 12, marginTop: 4 }}>上のボタンから業務記録を追加しましょう</div>
          </div>
        )}
        {todayTasks.map((task) => <TaskItem key={task.id} task={task} onDelete={handleDelete} onEdit={handleEdit} categoryMap={categoryMap} />)}

        {/* 日報まとめボタン */}
        {todayTasks.length > 0 && !showForm && (
          <button onClick={() => setShowSummary(true)} style={{
            width: "100%", padding: "13px", borderRadius: 14, border: "none",
            background: summaries.find(s => s.date === selectedDate) ? "#ecfdf5" : "linear-gradient(135deg, #1e3a5f, #2563eb)",
            color: summaries.find(s => s.date === selectedDate) ? "#059669" : "#fff",
            fontSize: 14, fontWeight: 700, cursor: "pointer", marginTop: 8,
          }}>
            {summaries.find(s => s.date === selectedDate) ? "✓ 日報まとめ済み（再編集）" : "📝 日報まとめを作成"}
          </button>
        )}
      </div>

      {/* モーダル */}
      {showSummary && (
        <DailySummaryModal
          date={selectedDate}
          tasks={todayTasks}
          existingSummary={summaries.find(s => s.date === selectedDate)}
          categoryMap={categoryMap}
          onSave={(summary) => { persistSummary(summary); setShowSummary(false); }}
          onClose={() => setShowSummary(false)}
        />
      )}
      {showMorning && (
        <MorningReportModal date={selectedDate} onClose={() => setShowMorning(false)} />
      )}

      {selectedDate !== getToday() && (
        <button onClick={() => { setSelectedDate(getToday()); setShowForm(false); setEditingTask(null); }} style={{
          position: "fixed", bottom: 72, right: 20, background: "#2563eb", color: "#fff", border: "none",
          borderRadius: 50, width: 52, height: 52, fontSize: 12, fontWeight: 800, cursor: "pointer",
          boxShadow: "0 4px 16px rgba(37,99,235,0.35)", display: "flex", alignItems: "center", justifyContent: "center",
        }}>今日</button>
      )}
      <NavBar />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<WorkLog />);
</script>
</body>
</html>
