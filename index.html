const GAS_URL = "https://script.google.com/macros/s/AKfycbz8-4QA2_bgqXBAL4ZlW6mNyQ2GxTmdURf-xq2Yqh8dmTu5_d0bsGZ3aJ4m15bxHlSbqg/exec";

  { id: "routine", label: "定型業務", icon: "📄", color: "#2563eb" },
  { id: "client", label: "クライアント対応", icon: "🤝", color: "#7c3aed" },

  { id: "misc", label: "その他事務作業", icon: "📎", color: "#78716c" },
];

const LOCAL_KEY = "worklog-entries";

function formatMinutes(min) {
  if (!min) return "";
  const h = Math.floor(min / 60);
  const m = min % 60;
  if (h > 0 && m > 0) return `${h}h${m}m`;
  if (h > 0) return `${h}h`;
  return `${m}m`;
}

function formatDate(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const days = ["日", "月", "火", "水", "木", "金", "土"];
  return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}（${days[d.getDay()]}）`;
}
function getToday() {
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, "0")}-${String(n.getDate()).padStart(2, "0")}`;
}
function getMonthKey(d) { return d.substring(0, 7); }
function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 5); }

// ─── Storage: localStorage + Cloud sync (JSONP方式でCORS回避) ───
function loadLocal() { try { return JSON.parse(localStorage.getItem(LOCAL_KEY)) || {}; } catch { return {}; } }
function saveLocal(e) { localStorage.setItem(LOCAL_KEY, JSON.stringify(e)); }

function jsonp(url) {
  return new Promise((resolve, reject) => {
    const cbName = "_cb_" + Date.now() + "_" + Math.random().toString(36).substr(2, 5);
    const timeout = setTimeout(() => { cleanup(); reject(new Error("timeout")); }, 15000);
    function cleanup() { clearTimeout(timeout); delete window[cbName]; if (script.parentNode) script.parentNode.removeChild(script); }
    window[cbName] = (data) => { cleanup(); resolve(data); };
    const script = document.createElement("script");
    script.src = url + (url.includes("?") ? "&" : "?") + "callback=" + cbName;
    script.onerror = () => { cleanup(); reject(new Error("network")); };
    document.head.appendChild(script);
  });
}

async function cloudFetch() {
  if (!GAS_URL) return null;
  try {
    const data = await jsonp(GAS_URL + "?action=fetch");
    if (data.success) return data.entries;
  } catch (e) { console.error("Cloud fetch error:", e); }
  return null;
}

async function cloudSaveTask(date, task) {
  if (!GAS_URL) return;
  try {
    const payload = encodeURIComponent(JSON.stringify({ date, task }));
    await jsonp(GAS_URL + "?action=saveTask&payload=" + payload);
  } catch (e) { console.error("Cloud save error:", e); }
}

async function cloudDeleteTask(taskId) {
  if (!GAS_URL) return;
  try {
    await jsonp(GAS_URL + "?action=deleteTask&id=" + encodeURIComponent(taskId));
  } catch (e) { console.error("Cloud delete error:", e); }
}

async function cloudDeleteDay(date) {
  if (!GAS_URL) return;
  try {
    await jsonp(GAS_URL + "?action=deleteDay&date=" + encodeURIComponent(date));
  } catch (e) { console.error("Cloud delete error:", e); }
}

}

async function cloudFetchCalendar(date) {

const GCHAT_WEBHOOK = "https://chat.googleapis.com/v1/spaces/AAQAKwqo4bc/messages?key=AIzaSyDdI0hCZtE6vySjMm-WEfRq3CPzqKqqsHI&token=fSrFTRpB_IFv2VfB5d2_2cz4cE5ouwjTfUGULJAxIxY";

// ─── SyncStatus indicator ───
function SyncBadge({ status }) {
  const colors = { synced: "#059669", syncing: "#d97706", offline: "#94a3b8", error: "#dc2626", nourl: "#94a3b8" };
  const labels = { synced: "同期済み", syncing: "同期中…", offline: "オフライン", error: "同期エラー", nourl: "URL未設定" };
  return (
    <div style={{ display: "flex", alignItems: "center", fontSize: 10, color: colors[status], fontWeight: 600 }}>
      {status === "syncing" ? <span className="spinner" style={{ width: 10, height: 10, borderWidth: 1.5, borderColor: "rgba(217,167,6,0.3)", borderTopColor: "#d97706", marginRight: 6 }} /> : <span className="sync-dot" style={{ background: colors[status] }} />}
      {labels[status]}
    </div>
  );
}

// ─── TaskItem ───
function TaskItem({ task, onDelete, onEdit, categoryMap, readOnly }) {
  const [confirmDelete, setConfirmDelete] = useState(false);
  const cat = categoryMap[task.category];
  const mins = task.minutes || (task.hours ? Math.round(task.hours * 60) : null);
  return (
    <div className="fade-in" style={{
      background: "#fff", borderRadius: 14, padding: "14px 16px", marginBottom: 10,
      borderLeft: `4px solid ${cat?.color || "#ccc"}`, boxShadow: "0 1px 4px rgba(0,0,0,0.04)", position: "relative",
    }}>
      {confirmDelete && (
        <div style={{ position: "absolute", inset: 0, background: "rgba(255,255,255,0.95)", borderRadius: 14, display: "flex", alignItems: "center", justifyContent: "center", gap: 10, zIndex: 10, backdropFilter: "blur(2px)" }}>
          <span style={{ fontSize: 13, fontWeight: 600, color: "#dc2626" }}>削除しますか？</span>
          <button onClick={() => { onDelete(task.id); setConfirmDelete(false); }} style={{ padding: "6px 16px", borderRadius: 8, border: "none", background: "#dc2626", color: "#fff", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>削除</button>
          <button onClick={() => setConfirmDelete(false)} style={{ padding: "6px 16px", borderRadius: 8, border: "1.5px solid #e2e8f0", background: "#fff", color: "#64748b", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>戻る</button>
        </div>
      )}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 6, flexWrap: "wrap" }}>
            <span style={{ fontSize: 11, background: cat?.color + "18", color: cat?.color, padding: "2px 8px", borderRadius: 20, fontWeight: 600, whiteSpace: "nowrap" }}>{cat?.icon} {cat?.label}</span>
            {mins && <span style={{ fontSize: 10, color: "#94a3b8", fontWeight: 500 }}>⏱ {formatMinutes(mins)}</span>}
          </div>
          <div style={{ fontSize: 14, fontWeight: 600, color: "#1e293b", lineHeight: 1.5, marginBottom: task.detail ? 4 : 0 }}>
            {task.caseName && <span style={{ color: "#64748b", fontWeight: 500, fontSize: 12 }}>【{task.caseName}】</span>}
            {task.detail || task.title || ""}
          </div>
        </div>
        {!readOnly && (
          <div style={{ display: "flex", gap: 4, flexShrink: 0 }}>
            <button onClick={() => onEdit(task)} style={{ background: "none", border: "none", cursor: "pointer", fontSize: 16, padding: 4, color: "#94a3b8" }}>✎</button>
            <button onClick={() => setConfirmDelete(true)} style={{ background: "none", border: "none", cursor: "pointer", fontSize: 16, padding: 4, color: "#94a3b8" }}>×</button>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── TaskForm（ストップウォッチ内蔵 + 下書き自動保存） ───
function TaskForm({ onSave, onCancel, initialData }) {
  const DRAFT_KEY = "worklog-taskform-draft";
  const SW_KEY = "worklog-taskform-sw";

  // 下書きの読み込み
  let draft = null;
  let swState = null;
  if (!initialData) {
    try { draft = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null"); } catch (e) {}
    try { swState = JSON.parse(localStorage.getItem(SW_KEY) || "null"); } catch (e) {}
  }

  const [category, setCategory] = useState((initialData && initialData.category) || (draft && draft.category) || "");
  const [caseName, setCaseName] = useState((initialData && initialData.caseName) || (draft && draft.caseName) || "");
  const [detail, setDetail] = useState((initialData && (initialData.detail || initialData.title)) || (draft && draft.detail) || "");
  const [minutes, setMinutes] = useState(() => {
    if (initialData && initialData.minutes) return String(initialData.minutes);
    if (initialData && initialData.hours) return String(Math.round(initialData.hours * 60));
    if (draft && draft.minutes) return draft.minutes;
    return "";
  });

  // 入力内容を下書きとして自動保存
  useEffect(() => {
    if (initialData) return;
    if (!category && !caseName && !detail && !minutes) {
      localStorage.removeItem(DRAFT_KEY);
      return;
    }
    localStorage.setItem(DRAFT_KEY, JSON.stringify({ category: category, caseName: caseName, detail: detail, minutes: minutes }));
  }, [category, caseName, detail, minutes, initialData]);

  // ── ストップウォッチ ──
  let initialElapsed = 0;
  if (swState) {
    if (swState.running && swState.startMs) {
      initialElapsed = Math.floor((Date.now() - swState.startMs) / 1000);
    } else if (swState.elapsed) {
      initialElapsed = swState.elapsed;
    }
  }
  const [swRunning, setSwRunning] = useState(swState ? !!swState.running : false);
  const [swElapsed, setSwElapsed] = useState(initialElapsed);
  const swIntervalRef = React.useRef(null);
  const swStartRef = React.useRef(swState && swState.running && swState.startMs ? swState.startMs : null);

  const saveSwState = (running, elapsed, startMs) => {
    if (initialData) return;
    if (!running && elapsed === 0) {
      localStorage.removeItem(SW_KEY);
      return;
    }
    localStorage.setItem(SW_KEY, JSON.stringify({ running: running, elapsed: elapsed, startMs: startMs }));
  };

  // マウント時に起動中だったらintervalを再開
  useEffect(() => {
    if (swRunning && swStartRef.current) {
      swIntervalRef.current = setInterval(() => {
        setSwElapsed(Math.floor((Date.now() - swStartRef.current) / 1000));
      }, 500);
    }
    return () => clearInterval(swIntervalRef.current);
  }, []);

  const swStart = () => {
    swStartRef.current = Date.now() - swElapsed * 1000;
    swIntervalRef.current = setInterval(() => setSwElapsed(Math.floor((Date.now() - swStartRef.current) / 1000)), 500);
    setSwRunning(true);
    saveSwState(true, swElapsed, swStartRef.current);
  };
  const swPause = () => {
    clearInterval(swIntervalRef.current);
    setSwRunning(false);
    saveSwState(false, swElapsed, null);
  };
  const swReset = () => {
    clearInterval(swIntervalRef.current);
    setSwRunning(false);
    setSwElapsed(0);
    swStartRef.current = null;
    localStorage.removeItem(SW_KEY);
  };
  const swUse = () => {
    const m = Math.ceil(swElapsed / 60);
    setMinutes(String(m));
    swReset();
  };
  const swFmt = (s) => { const m = Math.floor(s / 60), sec = s % 60; return String(m).padStart(2,"0") + ":" + String(sec).padStart(2,"0"); };
  const swMins = Math.ceil(swElapsed / 60);

  const clearDrafts = () => {
    localStorage.removeItem(DRAFT_KEY);
    localStorage.removeItem(SW_KEY);
  };

  const canSave = category && detail.trim();
  const inp = { width: "100%", padding: "10px 14px", borderRadius: 10, border: "1.5px solid #e2e8f0", fontSize: 14, outline: "none", boxSizing: "border-box" };

  return (
    <div className="fade-in" style={{ background: "#fff", borderRadius: 18, padding: 20, boxShadow: "0 8px 32px rgba(0,0,0,0.10)", marginBottom: 16 }}>
      <div style={{ fontSize: 15, fontWeight: 700, color: "#1e293b", marginBottom: 16 }}>{initialData ? "記録を編集" : "新しい業務記録を追加"}</div>

      {/* カテゴリ */}
      <div style={{ marginBottom: 14 }}>
        <div style={{ fontSize: 12, fontWeight: 600, color: "#64748b", marginBottom: 8 }}>カテゴリ *</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
          {CATEGORIES.map((c) => (
            <button key={c.id} onClick={() => setCategory(c.id)} style={{
              padding: "6px 12px", borderRadius: 20, border: category === c.id ? `2px solid ${c.color}` : "2px solid #e2e8f0",
              background: category === c.id ? c.color + "15" : "#f8fafc", color: category === c.id ? c.color : "#64748b", fontSize: 12, fontWeight: 600, cursor: "pointer",
            }}>{c.icon} {c.label}</button>
          ))}
        </div>
      </div>

      {/* 案件名 */}
      <div style={{ marginBottom: 14 }}>
        <div style={{ fontSize: 12, fontWeight: 600, color: "#64748b", marginBottom: 6 }}>案件名</div>
        <input value={caseName} onChange={(e) => setCaseName(e.target.value)} placeholder="例：山田太郎 離婚調停事件" style={inp}
          onFocus={(e) => e.target.style.borderColor = "#2563eb"} onBlur={(e) => e.target.style.borderColor = "#e2e8f0"} />
      </div>

      {/* 詳細メモ */}
      <div style={{ marginBottom: 14 }}>
        <div style={{ fontSize: 12, fontWeight: 600, color: "#64748b", marginBottom: 6 }}>詳細メモ *</div>
        <textarea value={detail} onChange={(e) => setDetail(e.target.value)} placeholder={"具体的な作業内容、進捗状況、\n次のアクションなどを記入"} rows={4}
          style={{ ...inp, resize: "vertical", fontFamily: "inherit", lineHeight: 1.6 }}
          onFocus={(e) => e.target.style.borderColor = "#2563eb"} onBlur={(e) => e.target.style.borderColor = "#e2e8f0"} />
      </div>

      {/* 作業時間 + ストップウォッチ */}
      <div style={{ marginBottom: 18 }}>
        <div style={{ fontSize: 12, fontWeight: 600, color: "#64748b", marginBottom: 8 }}>作業時間</div>

        {/* ストップウォッチ */}
        <div style={{ background: "#f8fafc", borderRadius: 12, padding: "12px 14px", marginBottom: 10 }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
            <span style={{ fontSize: 11, color: "#94a3b8", fontWeight: 600, letterSpacing: 0.5 }}>⏱ ストップウォッチ</span>
            {swElapsed > 0 && !swRunning && (
              <button onClick={swReset} style={{ background: "none", border: "none", fontSize: 11, color: "#94a3b8", cursor: "pointer" }}>リセット</button>
            )}
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            {/* タイマー表示 */}
            <div style={{
              fontSize: 28, fontWeight: 800, fontFamily: "monospace", letterSpacing: 1,
              color: swRunning ? "#2563eb" : swElapsed > 0 ? "#1e293b" : "#cbd5e1",
              minWidth: 80,
            }}>{swFmt(swElapsed)}</div>
            {/* ボタン */}
            <div style={{ display: "flex", gap: 6, flex: 1 }}>
              {!swRunning ? (
                <button onClick={swStart} style={{
                  flex: 1, padding: "8px 0", borderRadius: 10, border: "none",
                  background: "#2563eb", color: "#fff", fontSize: 13, fontWeight: 700, cursor: "pointer",
                }}>{swElapsed > 0 ? "▶ 再開" : "▶ スタート"}</button>
              ) : (
                <button onClick={swPause} style={{
                  flex: 1, padding: "8px 0", borderRadius: 10, border: "none",
                  background: "#f59e0b", color: "#fff", fontSize: 13, fontWeight: 700, cursor: "pointer",
                }}>⏸ 停止</button>
              )}
              {swElapsed > 0 && !swRunning && (
                <button onClick={swUse} style={{
                  flex: 1, padding: "8px 0", borderRadius: 10, border: "none",
                  background: "#059669", color: "#fff", fontSize: 12, fontWeight: 700, cursor: "pointer",
                }}>✓ {swMins}分を入力</button>
              )}
            </div>
          </div>
        </div>

        {/* 分入力 */}
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <div style={{ position: "relative", width: 120 }}>
            <input value={minutes} onChange={(e) => setMinutes(e.target.value.replace(/[^0-9]/g, ""))} placeholder="0"
              style={{ width: "100%", padding: "10px 36px 10px 14px", borderRadius: 10, border: "1.5px solid #e2e8f0", fontSize: 14, outline: "none", boxSizing: "border-box", textAlign: "right" }} />
            <span style={{ position: "absolute", right: 12, top: "50%", transform: "translateY(-50%)", fontSize: 12, color: "#94a3b8" }}>分</span>
          </div>
          {minutes && parseInt(minutes) >= 60 && (
            <span style={{ fontSize: 12, color: "#64748b" }}>= {formatMinutes(parseInt(minutes))}</span>
          )}
        </div>
      </div>

      <div style={{ display: "flex", gap: 10 }}>
        <button onClick={() => { clearDrafts(); onCancel(); }} style={{ flex: 1, padding: "12px 0", borderRadius: 12, border: "1.5px solid #e2e8f0", background: "#fff", color: "#64748b", fontSize: 14, fontWeight: 600, cursor: "pointer" }}>キャンセル</button>
        <button disabled={!canSave} onClick={() => {
          if (!canSave) return;
          clearDrafts();
          onSave({ id: initialData?.id || generateId(), category, caseName: caseName.trim(), title: "", detail: detail.trim(), priority: "medium", minutes: minutes ? parseInt(minutes) : null, hours: minutes ? parseInt(minutes) / 60 : null });
        }} style={{ flex: 2, padding: "12px 0", borderRadius: 12, border: "none", background: canSave ? "#2563eb" : "#cbd5e1", color: "#fff", fontSize: 14, fontWeight: 700, cursor: canSave ? "pointer" : "default" }}>
          {initialData ? "更新する" : "保存する"}
        </button>
      </div>
    </div>
  );
}

// ─── MonthlyView ───
function MonthlyView({ entries, achievements, onBack }) {
  const categoryMap = {}; CATEGORIES.forEach((c) => (categoryMap[c.id] = c));
  const achTypeMap = {}; 
  const [copiedMonth, setCopiedMonth] = useState("");
  const months = {};
  Object.keys(entries).sort().reverse().forEach((date) => { const mk = getMonthKey(date); if (!months[mk]) months[mk] = {}; months[mk][date] = entries[date]; });

  // Also collect months from achievements
  (achievements || []).forEach((a) => { const mk = getMonthKey(a.date); if (!months[mk]) months[mk] = {}; });
  const monthKeys = Object.keys(months).sort().reverse();

  function getMonthStats(me) {
    let totalTasks = 0, totalMins = 0; const catCount = {}; const catMins = {};
    Object.values(me).forEach((dt) => dt.forEach((t) => {
      totalTasks++;
      const m = t.minutes || (t.hours ? Math.round(t.hours * 60) : 0);
      totalMins += m;
      catCount[t.category] = (catCount[t.category] || 0) + 1;
      catMins[t.category] = (catMins[t.category] || 0) + m;
    }));
    return { totalTasks, totalMins, catCount, catMins };
  }

  function getMonthAch(mk) {
    return (achievements || []).filter(a => getMonthKey(a.date) === mk);
  }

  function exportCSV(mk) {
    const md = months[mk] || {}, dates = Object.keys(md).sort(), bom = "\uFEFF";
    const esc = (s) => `"${(s || "").replace(/"/g, '""')}"`;
    let rows = ["日付,カテゴリ,案件名,詳細メモ,作業時間(分)"];
    dates.forEach((date) => (md[date] || []).forEach((t) => {
      const cat = categoryMap[t.category]?.label || t.category;
      const mins = t.minutes || (t.hours ? Math.round(t.hours * 60) : "");
      rows.push([date, esc(cat), esc(t.caseName), esc(t.detail || t.title), mins].join(","));
    }));
    rows.push(""); rows.push("【成果物】"); rows.push("完成日,種別,タイトル,URL,メモ");
    getMonthAch(mk).sort((a,b) => a.date.localeCompare(b.date)).forEach(a => {
      const ATYPES = [{id:"blog",label:"ブログ記事"},{id:"document",label:"書面・起案"},{id:"template",label:"テンプレート"},{id:"manual",label:"マニュアル"},{id:"system",label:"システム・ツール"},{id:"other",label:"その他"}];
      const t = ATYPES.find(t => t.id === a.type)?.label || a.type;
      rows.push([a.date, esc(t), esc(a.title), esc(a.url), esc(a.memo)].join(","));
    });
    const blob = new Blob([bom + rows.join("\n")], { type: "text/csv;charset=utf-8;" });
    const el = document.createElement("a"); el.href = URL.createObjectURL(blob);
    const [y, m] = mk.split("-"); el.download = `業務日報_${y}年${parseInt(m)}月.csv`; el.click();
  }

  function copyAsText(mk) {
    const md = months[mk] || {}, dates = Object.keys(md).sort(), [y, m] = mk.split("-");
    const stats = getMonthStats(md);
    const monthAch = getMonthAch(mk);
    let text = `══════════════════════════\n  業務日報　${parseInt(y)}年${parseInt(m)}月\n  稼働${dates.length}日 ・ ${stats.totalTasks}件 ・ ${formatMinutes(stats.totalMins)}\n══════════════════════════\n\n`;
    dates.forEach((date) => {
      text += `■ ${formatDate(date)}\n──────────────────\n`;
      (md[date] || []).forEach((t, i) => {
        const cat = categoryMap[t.category]?.label || t.category;
        const mins = t.minutes || (t.hours ? Math.round(t.hours * 60) : 0);
        text += `  ${i + 1}. [${cat}]`; if (mins) text += ` ${formatMinutes(mins)}`; text += "\n";
        if (t.caseName) text += `     案件：${t.caseName}\n`;
        const content = t.detail || t.title || "";
        if (content) text += `     内容：${content.replace(/\n/g, "\n           ")}\n`;
        text += "\n";
      });
    });
    text += `──────────────────\n【カテゴリ別集計】\n`;
    CATEGORIES.filter((c) => stats.catCount[c.id]).forEach((c) => {
      text += `  ${c.label}：${stats.catCount[c.id]}件`;
      if (stats.catMins[c.id]) text += ` / ${formatMinutes(stats.catMins[c.id])}`;
      text += "\n";
    });
    if (monthAch.length > 0) {
      const ATYPES = [{id:"blog",label:"ブログ記事",icon:"✍️"},{id:"document",label:"書面・起案",icon:"⚖️"},{id:"template",label:"テンプレート",icon:"📋"},{id:"manual",label:"マニュアル",icon:"📖"},{id:"system",label:"システム・ツール",icon:"🖥️"},{id:"other",label:"その他",icon:"📎"}];
      text += `\n──────────────────\n【今月の成果物】（${monthAch.length}件）\n`;
      monthAch.sort((a,b) => a.date.localeCompare(b.date)).forEach((a, i) => {
        const t = ATYPES.find(t => t.id === a.type) || ATYPES[5];
        text += `  ${i + 1}. ${t.icon} [${t.label}] ${a.title}\n`;
        if (a.url) text += `     URL：${a.url}\n`;
        if (a.memo) text += `     備考：${a.memo}\n`;
        text += "\n";
      });
    }
    navigator.clipboard.writeText(text).then(() => { setCopiedMonth(mk); setTimeout(() => setCopiedMonth(""), 2000); });
  }

  // ── Bar chart component ──
  function CategoryChart({ stats }) {
    const cats = CATEGORIES.filter(c => stats.catMins[c.id] > 0);
    if (cats.length === 0) return null;
    const maxMins = Math.max(...cats.map(c => stats.catMins[c.id]));
    return (
      <div style={{ marginTop: 14, padding: "14px 16px", background: "#f8fafc", borderRadius: 12 }}>
        <div style={{ fontSize: 11, fontWeight: 700, color: "#64748b", marginBottom: 10 }}>カテゴリ別作業時間</div>
        {cats.sort((a,b) => stats.catMins[b.id] - stats.catMins[a.id]).map(c => {
          const pct = (stats.catMins[c.id] / maxMins) * 100;
          return (
            <div key={c.id} style={{ marginBottom: 8 }}>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 3 }}>
                <span style={{ fontSize: 11, color: c.color, fontWeight: 600 }}>{c.icon} {c.label}</span>
                <span style={{ fontSize: 11, color: "#64748b" }}>{formatMinutes(stats.catMins[c.id])} ({stats.catCount[c.id]}件)</span>
              </div>
              <div style={{ background: "#e2e8f0", borderRadius: 4, height: 8, overflow: "hidden" }}>
                <div style={{ width: `${pct}%`, background: c.color, height: "100%", borderRadius: 4, transition: "width 0.6s ease" }} />
              </div>
            </div>
          );
        })}
      </div>
    );
  }

  const [expandedMonth, setExpandedMonth] = useState(monthKeys[0] || "");
  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
        <div style={{ fontSize: 18, fontWeight: 800, color: "#1e293b" }}>月次レポート</div>
      </div>
      {monthKeys.length === 0 && <div style={{ textAlign: "center", padding: 40, color: "#94a3b8" }}>まだ記録がありません</div>}
      {monthKeys.map((mk) => {
        const stats = getMonthStats(months[mk] || {});
        const isExpanded = expandedMonth === mk, [y, m] = mk.split("-");
        const dates = Object.keys(months[mk] || {}).filter(d => (months[mk][d] || []).length > 0).sort().reverse();
        const monthAch = getMonthAch(mk);
        return (
          <div key={mk} style={{ background: "#fff", borderRadius: 16, marginBottom: 14, overflow: "hidden", boxShadow: "0 1px 4px rgba(0,0,0,0.04)" }}>
            <button onClick={() => setExpandedMonth(isExpanded ? "" : mk)} style={{ width: "100%", padding: "16px 18px", background: isExpanded ? "#f0f4ff" : "#fff", border: "none", cursor: "pointer", textAlign: "left" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div>
                  <div style={{ fontSize: 17, fontWeight: 800, color: "#1e293b" }}>{parseInt(y)}年{parseInt(m)}月</div>
                  <div style={{ fontSize: 12, color: "#64748b", marginTop: 4 }}>
                    {dates.length}日稼働 ・ {stats.totalTasks}件 ・ {formatMinutes(stats.totalMins)}
                    {monthAch.length > 0 && <span style={{ color: "#059669", marginLeft: 8 }}>🏆 成果物{monthAch.length}件</span>}
                  </div>
                </div>
                <span style={{ fontSize: 18, color: "#94a3b8", transform: isExpanded ? "rotate(180deg)" : "none", transition: "transform 0.2s" }}>▾</span>
              </div>
              <div style={{ display: "flex", gap: 6, marginTop: 10, flexWrap: "wrap" }}>
                {CATEGORIES.filter((c) => stats.catCount[c.id]).map((c) => (
                  <span key={c.id} style={{ fontSize: 11, background: c.color + "12", color: c.color, padding: "2px 8px", borderRadius: 12, fontWeight: 600 }}>{c.icon} {c.label} ({stats.catCount[c.id]})</span>
                ))}
              </div>
            </button>
            {isExpanded && (
              <div style={{ padding: "0 14px 14px" }}>
                {/* Export buttons */}
                <div style={{ display: "flex", gap: 8, marginTop: 12, marginBottom: 4 }}>
                  <button onClick={(e) => { e.stopPropagation(); exportCSV(mk); }} style={{ flex: 1, padding: "10px 0", borderRadius: 10, border: "1.5px solid #2563eb", background: "#eff6ff", color: "#2563eb", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>📥 CSV</button>
                  <button onClick={(e) => { e.stopPropagation(); copyAsText(mk); }} style={{
                    flex: 1, padding: "10px 0", borderRadius: 10,
                    border: copiedMonth === mk ? "1.5px solid #059669" : "1.5px solid #64748b",
                    background: copiedMonth === mk ? "#ecfdf5" : "#f8fafc",
                    color: copiedMonth === mk ? "#059669" : "#475569", fontSize: 13, fontWeight: 700, cursor: "pointer",
                  }}>{copiedMonth === mk ? "✓ コピー済み" : "📋 テキストコピー"}</button>
                </div>

                {/* Graph */}
                <CategoryChart stats={stats} />

                {/* Achievements section */}
                {monthAch.length > 0 && (
                  <div style={{ marginTop: 16 }}>
                    <div style={{ fontSize: 13, fontWeight: 700, color: "#059669", marginBottom: 8, paddingBottom: 4, borderBottom: "1px solid #d1fae5" }}>
                      🏆 今月の成果物（{monthAch.length}件）
                    </div>
                    {monthAch.sort((a,b) => a.date.localeCompare(b.date)).map(a => {
                      const ATYPES = [{id:"blog",label:"ブログ記事",icon:"✍️",color:"#d97706"},{id:"document",label:"書面・起案",icon:"⚖️",color:"#dc2626"},{id:"template",label:"テンプレート",icon:"📋",color:"#2563eb"},{id:"manual",label:"マニュアル",icon:"📖",color:"#0891b2"},{id:"system",label:"システム・ツール",icon:"🖥️",color:"#059669"},{id:"other",label:"その他",icon:"📎",color:"#78716c"}];
                      const t = ATYPES.find(t => t.id === a.type) || ATYPES[5];
                      return (
                        <div key={a.id} style={{ background: "#f0fdf4", borderRadius: 10, padding: "10px 12px", marginBottom: 8, borderLeft: `3px solid ${t.color}` }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 3 }}>
                            <span style={{ fontSize: 10, background: t.color + "18", color: t.color, padding: "1px 7px", borderRadius: 12, fontWeight: 600 }}>{t.icon} {t.label}</span>
                            <span style={{ fontSize: 10, color: "#94a3b8" }}>{a.date}</span>
                          </div>
                          <div style={{ fontSize: 13, fontWeight: 600, color: "#1e293b" }}>
                            {a.url ? <a href={a.url} target="_blank" rel="noopener noreferrer" style={{ color: "#1e293b", textDecoration: "none" }}>{a.title} <span style={{ fontSize: 10, color: "#2563eb" }}>↗</span></a> : a.title}
                          </div>
                          {a.memo && <div style={{ fontSize: 11.5, color: "#64748b", marginTop: 2 }}>{a.memo}</div>}
                        </div>
                      );
                    })}
                  </div>
                )}

                {/* Daily task list */}
                {dates.map((date) => (
                  <div key={date} style={{ marginTop: 14 }}>
                    <div style={{ fontSize: 13, fontWeight: 700, color: "#475569", marginBottom: 8, paddingBottom: 4, borderBottom: "1px solid #f1f5f9" }}>
                      {formatDate(date)}
                      <span style={{ fontWeight: 500, color: "#94a3b8", marginLeft: 8 }}>{(months[mk][date] || []).length}件{(() => { const dm = (months[mk][date] || []).reduce((s, t) => s + (t.minutes || (t.hours ? Math.round(t.hours * 60) : 0)), 0); return dm > 0 ? ` ・ ${formatMinutes(dm)}` : ""; })()}</span>
                    </div>
                    {(months[mk][date] || []).map((task) => <TaskItem key={task.id} task={task} onDelete={() => {}} onEdit={() => {}} categoryMap={categoryMap} readOnly />)}
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// WordPress REST API でタイトル・日付を取得
async function fetchWpInfo(url) {
  try {
    const u = new URL(url);
    // スラッグ形式 or ?p=123 形式どちらも対応
    const slug = u.pathname.replace(/\/$/, "").split("/").pop();
    const postId = u.searchParams.get("p");
    const base = `${u.protocol}//${u.host}`;

    let apiUrl;
    if (postId) {
      apiUrl = `${base}/wp-json/wp/v2/posts/${postId}?_fields=title,date`;
    } else {
      apiUrl = `${base}/wp-json/wp/v2/posts?slug=${slug}&_fields=title,date`;
    }

    const res = await fetch(apiUrl);
    if (!res.ok) throw new Error("fetch failed");
    const data = await res.json();
    const post = Array.isArray(data) ? data[0] : data;
    if (!post) return null;
    return {
      title: post.title?.rendered?.replace(/&amp;/g, "&").replace(/&#[0-9]+;/g, (m) => String.fromCharCode(parseInt(m.slice(2, -1)))) || "",
      date: post.date ? post.date.substring(0, 10) : "",
    };
  } catch { return null; }
}

  achievements.forEach((a) => {
    const mk = getMonthKey(a.date);
    if (!months[mk]) months[mk] = [];
    months[mk].push(a);
  });
  const monthKeys = Object.keys(months).sort().reverse();
  const displayMonths = filterMonth ? { [filterMonth]: months[filterMonth] || [] } : months;

  const handleSave = (item) => {
    onSave(item);
    setShowForm(false);
    setEditingItem(null);
  };
  const handleEdit = (item) => { setEditingItem(item); setShowForm(true); };

  return (
    <div style={{ padding: "0 0 100px", maxWidth: 520, margin: "0 auto" }}>
      {/* Header */}
      <div style={{ background: "linear-gradient(135deg, #064e3b, #059669)", padding: "24px 18px 20px", borderRadius: "0 0 24px 24px", color: "#fff", marginBottom: 18 }}>
        <div style={{ fontSize: 11, opacity: 0.7, fontWeight: 500, letterSpacing: 1 }}>ACHIEVEMENTS</div>
        <div style={{ fontSize: 20, fontWeight: 800, marginTop: 2, marginBottom: 14 }}>成果物ログ</div>
        <div style={{ display: "flex", gap: 12, alignItems: "center" }}>
          <div style={{ textAlign: "center" }}><div style={{ fontSize: 22, fontWeight: 800 }}>{achievements.length}</div><div style={{ fontSize: 10, opacity: 0.7 }}>合計</div></div>
          <div style={{ width: 1, background: "rgba(255,255,255,0.2)", height: 32 }} />
          {ACHIEVEMENT_TYPES.filter(t => achievements.some(a => a.type === t.id)).map(t => (
            <div key={t.id} style={{ textAlign: "center" }}>
              <div style={{ fontSize: 18, fontWeight: 800 }}>{achievements.filter(a => a.type === t.id).length}</div>
              <div style={{ fontSize: 9, opacity: 0.7 }}>{t.label}</div>
            </div>
          ))}
        </div>
      </div>

      <div style={{ padding: "0 16px" }}>
        {showForm ? (
          <AchievementForm onSave={handleSave} onCancel={() => { setShowForm(false); setEditingItem(null); }} initialData={editingItem} />
        ) : (
          <button onClick={() => { setEditingItem(null); setShowForm(true); }} style={{
            width: "100%", padding: "14px", borderRadius: 14, border: "2px dashed #a7f3d0",
            background: "#fff", color: "#059669", fontSize: 14, fontWeight: 700, cursor: "pointer", marginBottom: 16,
          }}>＋ 成果物を記録</button>
        )}

        {/* Month filter */}
        {monthKeys.length > 1 && !showForm && (
          <div style={{ display: "flex", gap: 6, marginBottom: 14, flexWrap: "wrap" }}>
            <button onClick={() => setFilterMonth("")} style={{
              padding: "4px 12px", borderRadius: 20, border: filterMonth === "" ? "2px solid #059669" : "2px solid #e2e8f0",
              background: filterMonth === "" ? "#ecfdf5" : "#f8fafc", color: filterMonth === "" ? "#059669" : "#64748b", fontSize: 11, fontWeight: 600, cursor: "pointer",
            }}>すべて</button>
            {monthKeys.map(mk => {
              const [y, m] = mk.split("-");
              return (
                <button key={mk} onClick={() => setFilterMonth(mk)} style={{
                  padding: "4px 12px", borderRadius: 20, border: filterMonth === mk ? "2px solid #059669" : "2px solid #e2e8f0",
                  background: filterMonth === mk ? "#ecfdf5" : "#f8fafc", color: filterMonth === mk ? "#059669" : "#64748b", fontSize: 11, fontWeight: 600, cursor: "pointer",
                }}>{parseInt(y)}年{parseInt(m)}月</button>
              );
            })}
          </div>
        )}

        {achievements.length === 0 && !showForm && (
          <div style={{ textAlign: "center", padding: "40px 20px", color: "#94a3b8" }}>
            <div style={{ fontSize: 36, marginBottom: 10 }}>🏆</div>
            <div style={{ fontSize: 14, fontWeight: 500 }}>まだ成果物が記録されていません</div>
            <div style={{ fontSize: 12, marginTop: 4 }}>上のボタンから記録しましょう</div>
          </div>
        )}

        {Object.keys(displayMonths).sort().reverse().map(mk => {
          const [y, m] = mk.split("-");
          const items = displayMonths[mk] || [];
          return (
            <div key={mk}>
              <div style={{ fontSize: 13, fontWeight: 700, color: "#475569", marginBottom: 8, paddingBottom: 4, borderBottom: "1px solid #e2e8f0" }}>
                {parseInt(y)}年{parseInt(m)}月 <span style={{ fontWeight: 500, color: "#94a3b8" }}>({items.length}件)</span>
              </div>
              {items.sort((a, b) => b.date.localeCompare(a.date)).map(item => (
                <AchievementItem key={item.id} item={item} onDelete={onDelete} onEdit={handleEdit} />
              ))}
            </div>
          );
        })}
      </div>
    </div>
  );
}
function DailySummaryModal({ date, tasks, existingSummary, categoryMap, onSave, onClose }) {
  const defaultMeet = { name: "", start: "", end: "" };
  const [meets, setMeets] = useState(
    existingSummary?.meets?.length ? existingSummary.meets : [{ ...defaultMeet }]
  );
  const [comment, setComment] = useState(existingSummary?.comment || "");
  const [sending, setSending] = useState(false);
  const [sent, setSent] = useState(false);
  const [copied, setCopied] = useState(false);
  const totalMins = tasks.reduce((s, t) => s + (t.minutes || (t.hours ? Math.round(t.hours * 60) : 0)), 0);

  // Calculate duration in minutes from HH:MM strings
  function calcMeetMins(start, end) {
    if (!start || !end) return 0;
    const [sh, sm] = start.split(":").map(Number);
    const [eh, em] = end.split(":").map(Number);
    const diff = (eh * 60 + em) - (sh * 60 + sm);
    return diff > 0 ? diff : 0;
  }

  function updateMeet(idx, field, value) {
    setMeets(prev => prev.map((m, i) => i === idx ? { ...m, [field]: value } : m));
  }
  function addMeet() { setMeets(prev => [...prev, { ...defaultMeet }]); }
  function removeMeet(idx) { setMeets(prev => prev.filter((_, i) => i !== idx)); }

  const validMeets = meets.filter(m => m.start && m.end && calcMeetMins(m.start, m.end) > 0);
  const totalMeetMins = validMeets.reduce((s, m) => s + calcMeetMins(m.start, m.end), 0);

  function buildText() {
    const catMap = {};
    tasks.forEach(t => {
      if (!catMap[t.category]) catMap[t.category] = { mins: 0, items: [] };
      catMap[t.category].mins += t.minutes || (t.hours ? Math.round(t.hours * 60) : 0);
      const content = t.detail || t.title || "";
      const taskMins = t.minutes || (t.hours ? Math.round(t.hours * 60) : 0);
      if (content) catMap[t.category].items.push((t.caseName ? `【${t.caseName}】` : "") + content + (taskMins ? `（${formatMinutes(taskMins)}）` : ""));
    });
    let text = `━━━━━━━━━━━━━━━━━━━━━━\n📋 業務日報　${formatDate(date)}\n━━━━━━━━━━━━━━━━━━━━━━\n\n【本日の業務】\n`;
    CATEGORIES.filter(c => catMap[c.id]).forEach(c => {
      const d = catMap[c.id];
      text += `\n${c.icon} ${c.label}${d.mins ? `（${formatMinutes(d.mins)}）` : ""}\n`;
      d.items.forEach(item => { text += `  ・${item}\n`; });
    });
    text += `\n合計作業時間：${formatMinutes(totalMins)}\n`;
    if (validMeets.length > 0) {
      text += `\n【Google Meet参加】（合計 ${formatMinutes(totalMeetMins)}）\n`;
      validMeets.forEach(m => {
        const mins = calcMeetMins(m.start, m.end);
        text += `  ・${m.start}〜${m.end}（${formatMinutes(mins)}）`;
        if (m.name) text += ` ${m.name}`;
        text += "\n";
      });
    }
    if (comment.trim()) text += `\n【一言】\n${comment.trim()}\n`;
    text += `━━━━━━━━━━━━━━━━━━━━━━`;
    return text;
  }

  const handleCopy = () => {
    navigator.clipboard.writeText(buildText()).then(() => { setCopied(true); setTimeout(() => setCopied(false), 2000); });
  };
  const handleSendAndSave = async () => {
    setSending(true);
    await sendToGoogleChat(buildText());
    onSave({ date, meets, totalMeetMins, comment: comment.trim(), sentAt: new Date().toISOString() });
    setSending(false); setSent(true); setTimeout(() => setSent(false), 2000);
  };

  const inp = { padding: "8px 10px", borderRadius: 8, border: "1.5px solid #e2e8f0", fontSize: 13, outline: "none", boxSizing: "border-box", fontFamily: "inherit", background: "#fff" };

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", zIndex: 200, display: "flex", alignItems: "flex-end", justifyContent: "center" }} onClick={onClose}>
      <div style={{ background: "#fff", borderRadius: "20px 20px 0 0", width: "100%", maxWidth: 520, maxHeight: "92vh", overflowY: "auto", padding: "24px 20px 44px" }} onClick={e => e.stopPropagation()}>

        {/* Header */}
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <div>
            <div style={{ fontSize: 16, fontWeight: 800, color: "#1e293b" }}>📝 日報まとめ</div>
            <div style={{ fontSize: 12, color: "#64748b", marginTop: 2 }}>{formatDate(date)}</div>
          </div>
          <button onClick={onClose} style={{ background: "#f1f5f9", border: "none", borderRadius: 8, width: 32, height: 32, fontSize: 16, cursor: "pointer", color: "#64748b" }}>×</button>
        </div>

        {/* Preview */}
        <div style={{ background: "#f8fafc", borderRadius: 12, padding: 14, marginBottom: 16, fontSize: 11.5, lineHeight: 1.8, color: "#334155", fontFamily: "monospace", whiteSpace: "pre-wrap", maxHeight: 160, overflowY: "auto" }}>
          {buildText()}
        </div>

        {/* Google Meet セクション */}
        <div style={{ marginBottom: 16 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
            <div style={{ fontSize: 12, fontWeight: 600, color: "#64748b" }}>
              📹 Google Meet参加
              {totalMeetMins > 0 && <span style={{ color: "#2563eb", marginLeft: 6 }}>合計 {formatMinutes(totalMeetMins)}</span>}
            </div>
            <button onClick={addMeet} style={{ background: "#eff6ff", border: "none", borderRadius: 8, padding: "4px 10px", fontSize: 12, fontWeight: 700, color: "#2563eb", cursor: "pointer" }}>＋ 追加</button>
          </div>

          {meets.map((m, idx) => {
            const mins = calcMeetMins(m.start, m.end);
            return (
              <div key={idx} style={{ background: "#f8fafc", borderRadius: 12, padding: 12, marginBottom: 8 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
                  {/* 開始時間 */}
                  <input type="time" value={m.start} onChange={e => updateMeet(idx, "start", e.target.value)}
                    style={{ ...inp, width: 100, textAlign: "center" }} />
                  <span style={{ fontSize: 12, color: "#94a3b8", flexShrink: 0 }}>〜</span>
                  {/* 終了時間 */}
                  <input type="time" value={m.end} onChange={e => updateMeet(idx, "end", e.target.value)}
                    style={{ ...inp, width: 100, textAlign: "center" }} />
                  {/* 時間表示 */}
                  {mins > 0 && <span style={{ fontSize: 11, color: "#2563eb", fontWeight: 600, flexShrink: 0 }}>{formatMinutes(mins)}</span>}
                  {/* 削除 */}
                  {meets.length > 1 && (
                    <button onClick={() => removeMeet(idx)} style={{ marginLeft: "auto", background: "none", border: "none", fontSize: 16, color: "#94a3b8", cursor: "pointer", flexShrink: 0 }}>×</button>
                  )}
                </div>
                {/* 会議名 */}
                <input value={m.name} onChange={e => updateMeet(idx, "name", e.target.value)}
                  placeholder="会議名（例：週次MTG、〇〇様打合せ）"
                  style={{ ...inp, width: "100%", fontSize: 12 }}
                  onFocus={e => e.target.style.borderColor = "#2563eb"} onBlur={e => e.target.style.borderColor = "#e2e8f0"} />
              </div>
            );
          })}
        </div>

        {/* Comment */}
        <div style={{ marginBottom: 20 }}>
          <div style={{ fontSize: 12, fontWeight: 600, color: "#64748b", marginBottom: 6 }}>一言・感想</div>
          <textarea value={comment} onChange={e => setComment(e.target.value)}
            placeholder="今日の振り返り、気づき、明日への引き継ぎなど" rows={3}
            style={{ width: "100%", padding: "10px 14px", borderRadius: 10, border: "1.5px solid #e2e8f0", fontSize: 14, outline: "none", boxSizing: "border-box", fontFamily: "inherit", resize: "vertical", lineHeight: 1.6 }}
            onFocus={e => e.target.style.borderColor = "#2563eb"} onBlur={e => e.target.style.borderColor = "#e2e8f0"} />
        </div>

        {/* Actions */}
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={handleCopy} style={{
            flex: 1, padding: "12px 0", borderRadius: 12,
            border: copied ? "1.5px solid #059669" : "1.5px solid #64748b",
            background: copied ? "#ecfdf5" : "#f8fafc",
            color: copied ? "#059669" : "#475569", fontSize: 13, fontWeight: 700, cursor: "pointer",
          }}>{copied ? "✓ コピー済み" : "📋 コピー"}</button>
          <button onClick={handleSendAndSave} disabled={sending} style={{
            flex: 2, padding: "12px 0", borderRadius: 12, border: "none",
            background: sent ? "#059669" : sending ? "#94a3b8" : "#2563eb",
            color: "#fff", fontSize: 13, fontWeight: 700, cursor: sending ? "default" : "pointer",
          }}>{sent ? "✓ 完了" : sending ? "送信中…" : "💬 Google Chatに送信して保存"}</button>
        </div>
      </div>
    </div>
  );
}

// ─── TodoItem ───
function TodoItem({ todo, onToggle, onDelete, onEdit, onTogglePrint, compact }) {
  const [confirmDelete, setConfirmDelete] = useState(false);
  const today = getToday();
  const isOverdue = todo.deadline && todo.deadline < today && !todo.done;
  const isToday = todo.deadline === today;
  const dlColor = todo.done ? "#94a3b8" : isOverdue ? "#dc2626" : isToday ? "#d97706" : "#64748b";
  const isMail = todo.type === "mail";
  return (
    <div className="fade-in" style={{
      background: "#fff", borderRadius: 12, padding: compact ? "10px 12px" : "12px 14px", marginBottom: 8,
      borderLeft: `4px solid ${todo.done ? "#cbd5e1" : isOverdue ? "#dc2626" : isToday ? "#d97706" : isMail ? "#0891b2" : "#2563eb"}`,
      boxShadow: "0 1px 3px rgba(0,0,0,0.04)", position: "relative", opacity: todo.done ? 0.6 : 1,
    }}>
      {confirmDelete && (
        <div style={{ position: "absolute", inset: 0, background: "rgba(255,255,255,0.95)", borderRadius: 12, display: "flex", alignItems: "center", justifyContent: "center", gap: 8, zIndex: 10 }}>
          <span style={{ fontSize: 12, fontWeight: 600, color: "#dc2626" }}>削除しますか？</span>
          <button onClick={() => { onDelete(todo.id); setConfirmDelete(false); }} style={{ padding: "5px 12px", borderRadius: 6, border: "none", background: "#dc2626", color: "#fff", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>削除</button>
          <button onClick={() => setConfirmDelete(false)} style={{ padding: "5px 12px", borderRadius: 6, border: "1.5px solid #e2e8f0", background: "#fff", color: "#64748b", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>戻る</button>
        </div>
      )}
      <div style={{ display: "flex", alignItems: "flex-start", gap: 10 }}>
        <button onClick={() => onToggle(todo.id)} style={{
          flexShrink: 0, width: 22, height: 22, borderRadius: 6, marginTop: 1,
          border: todo.done ? "none" : "2px solid #cbd5e1", background: todo.done ? "#059669" : "#fff",
          color: "#fff", fontSize: 13, fontWeight: 700, cursor: "pointer", padding: 0,
          display: "flex", alignItems: "center", justifyContent: "center",
        }}>{todo.done ? "✓" : ""}</button>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 13.5, fontWeight: 600, color: "#1e293b", textDecoration: todo.done ? "line-through" : "none", lineHeight: 1.5 }}>
            {isMail && <span style={{ fontSize: 10, background: "#cffafe", color: "#0891b2", padding: "1px 6px", borderRadius: 8, marginRight: 6, fontWeight: 700 }}>📮 郵送</span>}
            {todo.title}
          </div>
          {/* 郵送先表示 */}
          {isMail && todo.destination && (
            <div style={{ fontSize: 11, color: "#0891b2", fontWeight: 600, marginTop: 4 }}>
              📍 {todo.destination}
            </div>
          )}
          {/* 郵送タスク用バッジ（一覧から切り替え可能） */}
          {isMail && !compact && (
            <div style={{ display: "flex", gap: 6, marginTop: 6, flexWrap: "wrap" }}>
              <span style={{ fontSize: 10, padding: "2px 8px", borderRadius: 10, fontWeight: 600,
                background: todo.isBilling ? "#fef3c7" : "#f1f5f9",
                color: todo.isBilling ? "#d97706" : "#94a3b8",
              }}>{todo.isBilling ? "💰 費用請求回" : "通常回"}</span>
              <button onClick={() => onTogglePrint(todo.id)} style={{
                fontSize: 10, padding: "2px 8px", borderRadius: 10, fontWeight: 600, cursor: "pointer", border: "none",
                background: todo.printed ? "#dcfce7" : "#fee2e2",
                color: todo.printed ? "#059669" : "#dc2626",
              }}>{todo.printed ? "🖨 印刷済 ↻" : "未印刷 ↻"}</button>
            </div>
          )}
          {todo.deadline && (
            <div style={{ fontSize: 11, color: dlColor, fontWeight: 600, marginTop: 4 }}>
              📅 {todo.deadline}{isOverdue ? "（期限超過）" : isToday ? "（今日）" : ""}
            </div>
          )}
          {todo.memo && !compact && (
            <div style={{ fontSize: 12, color: "#64748b", lineHeight: 1.6, marginTop: 4, whiteSpace: "pre-wrap" }}>{todo.memo}</div>
          )}
          {todo.chatUrl && !compact && (
            <a href={todo.chatUrl} target="_blank" rel="noopener noreferrer" style={{
              display: "inline-flex", alignItems: "center", gap: 4, marginTop: 6,
              fontSize: 11, color: "#2563eb", textDecoration: "none", fontWeight: 600,
            }}>💬 Chatスペースを開く ↗</a>
          )}
        </div>
        {!compact && (
          <div style={{ display: "flex", gap: 2, flexShrink: 0 }}>
            <button onClick={() => onEdit(todo)} style={{ background: "none", border: "none", cursor: "pointer", fontSize: 14, padding: 2, color: "#94a3b8" }}>✎</button>
            <button onClick={() => setConfirmDelete(true)} style={{ background: "none", border: "none", cursor: "pointer", fontSize: 14, padding: 2, color: "#94a3b8" }}>×</button>
          </div>
        )}
      </div>
    </div>
  );
}

                background: !printed ? "#fef2f2" : "#fafafa",

                flex: 1, padding: "7px 0", borderRadius: 8,

                background: printed ? "#ecfdf5" : "#fafafa",

        </div>
        <input value={chatUrl} onChange={(e) => setChatUrl(e.target.value)}
